name: 求人更新

on:
  schedule:
    # UTC 表記。毎週月曜 00:00 UTC = 日本時間の月曜 09:00
    # LMO の掲載は平日に更新されるので、週1で十分追いつく
    - cron: '0 0 * * 1'
  workflow_dispatch:        # 手動実行用

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージ
        # 374 FSS の英語版求人告知(PDF)の読み取りに使う
        run: python3 -m pip install --quiet pypdf

      - name: 求人取得
        run: python3 fetch_jobs.py

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- jobs.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "求人データ更新 $(date -u '+%Y-%m-%d')"
          git push
